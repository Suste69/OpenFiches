<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Open Fiches casino chips</title>
  <!-- Back chip -->
  <g transform="translate(84,112) rotate(-18)">
    <circle r="46" fill="#26262B"/>
    <circle r="40" fill="none" stroke="#F3ECDD" stroke-width="6" stroke-dasharray="6 10"/>
    <circle r="30" fill="none" stroke="#F3ECDD" stroke-width="2"/>
  </g>
  <!-- Middle chip -->
  <g transform="translate(100,100)">
    <circle r="46" fill="#F3ECDD"/>
    <circle r="40" fill="none" stroke="#26262B" stroke-width="6" stroke-dasharray="6 10"/>
    <circle r="30" fill="none" stroke="#26262B" stroke-width="2"/>
  </g>
  <!-- Front chip: Open Fiches project-green accent -->
  <g transform="translate(116,88) rotate(18)">
    <circle r="46" fill="#2dd4bf"/>
    <circle r="40" fill="none" stroke="#F3ECDD" stroke-width="6" stroke-dasharray="6 10"/>
    <circle r="30" fill="none" stroke="#F3ECDD" stroke-width="2"/>
  </g>
</svg>
